[project]
name = "raggae"
version = "0.1.0"
description = "Core library for RAG document understanding and retrieval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.13.4",
    "pikepdf==10.12.0",
    "cryptography==50.0.0",
    "pillow==12.3.0",
    "pypdf==6.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
image-pdf = ["pypdfium2==5.13.0"]
table-ocr = ["img2table==1.4.0"]
text-markdown = ["markdown-it-py==4.2.0"]
text-html = ["beautifulsoup4==4.15.0", "trafilatura==2.2.0"]
text-office = ["openpyxl==3.1.5", "python-docx==1.2.0", "python-pptx==1.0.2"]
text-pandas = ["pandas==2.3.3", "openpyxl==3.1.5"]
text-pdf = ["pypdfium2==5.13.0", "pdfminer.six==20260107", "pdfplumber==0.11.10"]
text-tesseract = ["pytesseract==0.3.13"]
text-unstructured = ["unstructured[docx,pptx,xlsx,md]==0.27.8"]

[tool.hatch.build.targets.wheel]
packages = ["raggae"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
