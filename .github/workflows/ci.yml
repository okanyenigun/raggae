name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      source_ref:
        description: Verified release commit to test and build
        type: string
        required: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.5.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run pytest
        run: uv run --locked --no-sync pytest -x

  package:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.5.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Build source archive and wheel
        run: uv build --no-sources --build-constraints scripts/ci/build-constraints.txt
      - name: Check metadata and archive contents
        run: |
          uvx --from twine==6.2.0 twine check dist/*
          uv run --locked --no-sync python scripts/ci/check_release.py dist
      - name: Install and exercise the built wheel without the source checkout
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-smoke"
          uv pip install --index-url https://pypi.org/simple/ --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I scripts/ci/check_release.py smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
